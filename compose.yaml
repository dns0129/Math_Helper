services:
  math-assistant:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - math-auth:/app/.local
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "const host=new URL(process.env.MATH_PUBLIC_URL).host; fetch('http://127.0.0.1:'+process.env.PORT+'/healthz',{headers:{Host:host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  math-auth:
