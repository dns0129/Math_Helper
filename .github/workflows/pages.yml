name: Publish Math Helper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-math.txt
      - name: Verify the app
        run: npm test
      - name: Build the static demo
        env:
          VITE_MATH_CLOUD_URL: ${{ vars.MATH_CLOUD_URL }}
        run: npm run build:pages
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .release/pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
