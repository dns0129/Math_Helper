services:
  - type: web
    name: tuiyan-math-assistant
    runtime: docker
    repo: https://github.com/dns0129/Math_Helper
    branch: main
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MATH_ACCESS_PASSWORD
        generateValue: true
      - key: MATH_BIND_HOST
        value: 0.0.0.0
      - key: MATH_AUTH_STORAGE
        value: ephemeral
